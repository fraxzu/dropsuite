<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DropSuite Logo Candidates</title>
<link rel="stylesheet" href="../../frontend/src/index.css" />
<style>
  html, body { height: auto; }
  body { overflow: auto; user-select: text; background: var(--chrome); padding: 0 0 64px; }
  .sheet { max-width: 1392px; margin: 0 auto; padding: 0 24px; }
  .sheet-head { display: flex; align-items: baseline; gap: 16px; padding: 28px 0 20px; border-bottom: 1px solid var(--line); }
  .sheet-head h1 { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .sheet-head p { color: var(--text-3); font-size: 12px; }
  .label { font-size: 11px; color: var(--text-3); margin-bottom: 8px; }
  .cand { padding: 28px 0 32px; border-bottom: 1px solid var(--line); }
  .cand-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .cand-title .letter { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--accent-text); }
  .cand-title h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  .cand-concept { color: var(--text-2); font-size: 13px; max-width: 760px; line-height: 1.5; margin-bottom: 20px; }
  .row { display: grid; grid-template-columns: 296px 1fr; gap: 24px; }
  .master { width: 296px; height: 296px; background: var(--ground); border: 1px solid var(--line); display: grid; place-items: center; position: relative; }
  .master .grid { position: absolute; inset: 20px; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 16px 16px; opacity: 0.55; }
  .master svg { position: relative; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; align-content: start; }
  .panel { background: var(--ground); border: 1px solid var(--line); padding: 14px 16px; }
  .ladder { display: flex; align-items: flex-end; gap: 22px; }
  .ladder figure { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ladder figcaption, .zoom figcaption { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
  .zooms { display: flex; gap: 20px; margin-top: 14px; }
  .zoom { display: flex; flex-direction: column; gap: 6px; }
  .zoom canvas { image-rendering: pixelated; border: 1px solid var(--line); }
  .chrome.preview { height: 36px; border: 1px solid var(--line); }
  .chrome.preview .brand { gap: var(--lockup-gap, 8px); }
  .wm { font-family: var(--font-display); font-weight: 600; color: var(--text); white-space: nowrap; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tab { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px 8px 0 0; font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 12px; width: 220px; }
  .tabbar { display: flex; align-items: flex-end; padding: 6px 8px 0; }
  .tabbar.dark { background: #202124; } .tabbar.dark .tab { background: #35363a; color: #e8eaed; }
  .tabbar.light { background: #dee1e6; } .tabbar.light .tab { background: #fff; color: #202124; }
  .win { display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
  .desktop { background: #2f3a4c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 132px; font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .taskbars { display: flex; flex-direction: column; gap: 8px; }
  .taskbar { height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .taskbar.dark { background: #1f1f1f; } .taskbar.light { background: #eeeeee; }
  .tb-slot { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; position: relative; }
  .tb-slot.active { background: rgba(255,255,255,.08); }
  .taskbar.light .tb-slot.active { background: rgba(0,0,0,.06); }
  .tb-slot.active::after { content: ''; position: absolute; bottom: 2px; width: 16px; height: 3px; border-radius: 2px; background: #3d8bff; }
  .tb-other { width: 24px; height: 24px; border-radius: 5px; background: #6b7280; opacity: .55; }
  .plate { display: grid; place-items: center; border-radius: 22%; background: #18191c; box-shadow: inset 0 0 0 1px #383a41; }
  .monos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mono-tile { height: 84px; display: grid; place-items: center; border: 1px solid var(--line); }
  .mono-tile span { font-size: 10px; font-family: var(--font-mono); margin-top: 6px; display: block; text-align: center; }
  .eval { padding: 28px 0; }
  .eval h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin-bottom: 14px; }
  table.score { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.score th, table.score td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.score th { font-size: 11px; font-weight: 600; color: var(--text-3); }
  table.score td.n { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }
  table.score td.note { color: var(--text-2); }
  .rec { margin-top: 20px; padding: 16px 18px; background: var(--ground); border: 1px solid var(--line-strong); max-width: 920px; }
  .rec h3 { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .rec p { color: var(--text-2); font-size: 13px; line-height: 1.55; }
  .rec p + p { margin-top: 8px; }
</style>
</head>
<body>
<div class="sheet">
  <header class="sheet-head">
    <h1>DropSuite logo candidates</h1>
    <p>Three original SVG symbols on a 32-unit grid, rendered by the browser at true size. Production assets are unchanged until a candidate is approved.</p>
  </header>

  <section class="cand" id="current">
    <div class="cand-title"><span class="letter">—</span><h2>Current mark (for reference)</h2></div>
    <div class="label">Shipping chrome bar today: 18px mark, 8px gap, 13px wordmark</div>
    <div id="current-header"></div>
  </section>

  <div id="cands"></div>

  <section class="eval" id="eval"></section>
</div>

<script src="candidates.js"></script>
<script>
const C = DROPSUITE_CANDIDATES, P = DROPSUITE_PALETTE, svg = dropsuiteSvg;
const mono = (col) => ({ body: col, accent: col });
const CURRENT = `<svg width="18" height="18" viewBox="0 0 20 20"><path d="M2 6h5.2M12.8 6H18" stroke="#a8abb2" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M10 6.6v1.6" stroke="#3d8bff" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/><rect x="6.6" y="9.6" width="6.8" height="6.8" rx="1.6" fill="#3d8bff"/></svg>`;

function header(markHtml, opts = {}) {
  const wm = opts.refined
    ? `<span class="wm" style="font-size:14px;letter-spacing:-0.015em">DropSuite</span><span class="brand-version" style="margin-left:4px">0.1.0</span>`
    : `<span class="brand-name">DropSuite</span><span class="brand-version">0.1.0</span>`;
  return `<header class="chrome preview" style="--lockup-gap:${opts.gap ?? 8}px">
    <div class="brand">${markHtml}${wm}</div>
    <nav class="workspaces"><button class="ws-tab" aria-current="page">Proxy</button><button class="ws-tab">Target</button><span class="ws-divider"></span>
    <button class="ws-tab" disabled>Replay <span class="planned">planned</span></button><button class="ws-tab" disabled>Fuzzer <span class="planned">planned</span></button></nav>
    <div class="chrome-spacer"></div>
    <div class="listener"><span class="listener-state"><span class="dot live"></span>Listening on <span class="addr">127.0.0.1:8080</span></span><button class="btn btn-stop"><svg width="11" height="11" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="currentColor"/></svg>Stop</button></div>
  </header>`;
}

document.getElementById('current-header').innerHTML = header(CURRENT);

const host = document.getElementById('cands');
for (const c of C) {
  const sec = document.createElement('section');
  sec.className = 'cand';
  sec.id = `cand-${c.id}`;
  const ladder = [16, 20, 24, 32, 64].map((s) => `<figure>${svg(c, s, P.dark)}<figcaption>${s}</figcaption></figure>`).join('');
  const ladderLight = [16, 20, 24, 32, 64].map((s) => `<figure>${svg(c, s, P.light)}<figcaption>${s}</figcaption></figure>`).join('');
  const plate = (s, inner) => `<div class="plate" style="width:${s}px;height:${s}px">${svg(c, inner, P.dark)}</div>`;
  sec.innerHTML = `
    <div class="cand-title"><span class="letter">${c.letter}</span><h2>${c.name}</h2></div>
    <p class="cand-concept">${c.concept}</p>
    <div class="row">
      <div>
        <div class="label">Master, 256 px, on the 32-unit construction grid</div>
        <div class="master"><div class="grid"></div>${svg(c, 256, P.dark)}</div>
      </div>
      <div class="cols">
        <div style="grid-column: 1 / -1">
          <div class="label">Application header: refined lockup (20 px mark, 9 px gap, 14 px wordmark)</div>
          ${header(svg(c, 20, P.dark), { refined: true, gap: 9 })}
        </div>
        <div class="panel">
          <div class="label">True size on the dark ground</div>
          <div class="ladder">${ladder}</div>
          <div class="zooms">
            <div class="zoom"><canvas data-cand="${c.id}" data-px="16" width="96" height="96"></canvas><figcaption>16 px raster ×6</figcaption></div>
            <div class="zoom"><canvas data-cand="${c.id}" data-px="20" width="120" height="120"></canvas><figcaption>20 px raster ×6</figcaption></div>
          </div>
        </div>
        <div class="panel" style="background:#f4f4f5;border-color:#d4d4d8">
          <div class="label" style="color:#52525b">True size on light</div>
          <div class="ladder" style="--text-3:#52525b">${ladderLight}</div>
          <div class="label" style="color:#52525b;margin-top:16px">Favicon, browser tab (dev build)</div>
          <div class="tabs" style="grid-template-columns:1fr">
            <div class="tabbar light"><div class="tab">${svg(c, 16, P.light)}DropSuite</div></div>
          </div>
        </div>
        <div class="panel">
          <div class="label">Favicon, dark tab strip</div>
          <div class="tabbar dark"><div class="tab">${svg(c, 16, P.dark)}DropSuite</div></div>
          <div class="label" style="margin-top:14px">Monochrome</div>
          <div class="monos">
            <div class="mono-tile" style="background:#18191c">${svg(c, 40, mono('#ffffff'))}</div>
            <div class="mono-tile" style="background:#f4f4f5">${svg(c, 40, mono('#111214'))}</div>
            <div class="mono-tile" style="background:#2a6fe0">${svg(c, 40, mono('#ffffff'))}</div>
            <div class="mono-tile" style="background:#ffffff">${svg(c, 40, mono('#2a6fe0'))}</div>
          </div>
        </div>
        <div class="panel">
          <div class="label">Windows app icon: desktop 48 px, taskbar 24 px</div>
          <div class="win">
            <div class="desktop">${plate(48, 32)}<span>DropSuite</span></div>
            <div class="taskbars">
              <div class="taskbar dark"><div class="tb-slot"><div class="tb-other"></div></div><div class="tb-slot active">${plate(24, 16)}</div><div class="tb-slot"><div class="tb-other"></div></div></div>
              <div class="taskbar light"><div class="tb-slot"><div class="tb-other"></div></div><div class="tb-slot active">${plate(24, 16)}</div><div class="tb-slot"><div class="tb-other"></div></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  host.appendChild(sec);
}

// Rasterize each symbol at its real pixel size, then enlarge without smoothing to show the pixels.
for (const cv of document.querySelectorAll('canvas[data-cand]')) {
  const c = C.find((x) => x.id === cv.dataset.cand);
  const px = +cv.dataset.px;
  const small = document.createElement('canvas');
  small.width = small.height = px;
  const img = new Image();
  img.onload = () => {
    const s = small.getContext('2d');
    s.fillStyle = '#18191c';
    s.fillRect(0, 0, px, px);
    s.drawImage(img, 0, 0, px, px);
    const g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(small, 0, 0, cv.width, cv.height);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg(c, px, P.dark));
}

window.EVAL && (document.getElementById('eval').innerHTML = window.EVAL);
</script>
<script src="evaluation.js"></script>
</body>
</html>
