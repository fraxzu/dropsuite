<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DropSuite V3 Thumbnails, pass 2</title>
<style>
  body { margin: 0; padding: 24px; background: #131417; color: #a8abb2; font: 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .cell { background: #18191c; border: 1px solid #2a2c31; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  h3 { margin: 0; font-size: 12px; color: #e6e7ea; font-weight: 600; }
  .t { font-size: 11px; color: #878a92; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
// Drop outline: a full round base (r 20) rising to a point through two tangent curves.
const DROP = 'M32 2C32 2 52 24 52 40A20 20 0 0 1 12 40C12 24 32 2 32 2Z';
const T = [
  { name: 'A1b · Sliced Drop, low cut', terr: 'Controlled interception', body: (id) => `
    <defs><path id="${id}d" d="${DROP}"/>
      <clipPath id="${id}t"><rect width="64" height="40"/></clipPath>
      <clipPath id="${id}b"><rect y="45" width="64" height="20"/></clipPath></defs>
    <use href="#${id}d" clip-path="url(#${id}t)"/>
    <g transform="translate(5 0)"><use href="#${id}d" clip-path="url(#${id}b)"/></g>` },
  { name: 'A1c · Sliced Drop, sheared cut', terr: 'Controlled interception', body: (id) => `
    <defs><path id="${id}d" d="${DROP}"/>
      <clipPath id="${id}t"><path d="M0 0H64V30L0 44Z"/></clipPath>
      <clipPath id="${id}b"><path d="M0 50L64 36V64H0Z"/></clipPath></defs>
    <use href="#${id}d" clip-path="url(#${id}t)"/>
    <g transform="translate(4 2)"><use href="#${id}d" clip-path="url(#${id}b)"/></g>` },
  { name: 'B1b · Fold, single strip', terr: 'Data transformation', body: () => `
    <path d="M4 10H44L58 24H4Z"/><path d="M46 28H58V60L46 48Z"/>` },
  { name: 'B1c · Return Fold', terr: 'Data transformation', body: () => `
    <path d="M4 8H48L60 20H4Z"/><path d="M60 26V38H20L8 50V38L20 26Z"/>` },
  { name: 'C3 · Keel', terr: 'Abstract signature', body: () => `
    <path d="M14 4V40A20 20 0 1 0 34 20C26 20 18 13 14 4Z"/>` },
  { name: 'C4 · Tracer', terr: 'Abstract signature', body: () => `
    <path d="M2 26H22V38H2Z"/><path d="M28 18H42A14 14 0 0 1 42 46H28L36 32Z"/>` },
];
const g = document.getElementById('g');
T.forEach((t, i) => {
  const sv = (n, fill) => `<svg width="${n}" height="${n}" viewBox="0 0 64 64" fill="${fill}">${t.body('s' + i + '_' + n)}</svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="cell"><h3>${t.name}</h3><span class="t">${t.terr}</span>${sv(150, '#ececee')}<div class="row">${sv(32, '#ececee')}${sv(20, '#ececee')}${sv(16, '#ececee')}</div></div>`);
});
</script>
</body>
</html>
