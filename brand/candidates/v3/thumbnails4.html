<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DropSuite V3 Thumbnails, pass 4</title>
<style>
  body { margin: 0; padding: 24px; background: #131417; color: #a8abb2; font: 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .cell { background: #18191c; border: 1px solid #2a2c31; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  h3 { margin: 0; font-size: 12px; color: #e6e7ea; font-weight: 600; }
  .t { font-size: 11px; color: #878a92; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
const T = [
  { name: 'B5 · Hairpin', terr: 'Data transformation', body: () => `
    <path d="M4 10H40A22 22 0 0 1 40 54H18V40H40A8 8 0 0 0 40 24H4Z"/>` },
  { name: 'B6 · Torsion', terr: 'Data transformation', body: () => `
    <path d="M4 32A16 16 0 0 1 20 16L32 32L20 48A16 16 0 0 1 4 32Z"/><path d="M36 32L48 16H60V48H48Z"/>` },
  { name: 'B7 · Interlock', terr: 'Data transformation', body: () => `
    <path d="M6 8H44V22H20V44H6Z"/><path d="M58 56H20V42H44V20H58Z"/>` },
  { name: 'B8 · Countercurrent', terr: 'Data transformation', body: () => `
    <path d="M4 12H46L58 24H4Z"/><path d="M60 40H18L6 52H60Z"/><path d="M26 30H38V34H26Z" opacity="0"/>` },
  { name: 'B9 · Turning Stream', terr: 'Data transformation', body: () => `
    <path d="M4 8H28A28 28 0 0 1 56 36V60H42V36A14 14 0 0 0 28 22H4Z"/>` },
  { name: 'B10 · Drop Formation', terr: 'Data transformation', body: () => `
    <path d="M4 8H60V18H38C34 22 32 26 32 26C32 26 30 22 26 18H4Z"/><path d="M32 30C32 30 46 42 46 50A14 14 0 0 1 18 50C18 42 32 30 32 30Z"/>` },
];
const g = document.getElementById('g');
T.forEach((t, i) => {
  const sv = (n, fill) => `<svg width="${n}" height="${n}" viewBox="0 0 64 64" fill="${fill}">${t.body('s' + i + '_' + n)}</svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="cell"><h3>${t.name}</h3><span class="t">${t.terr}</span>${sv(150, '#ececee')}<div class="row">${sv(32, '#ececee')}${sv(20, '#ececee')}${sv(16, '#ececee')}</div></div>`);
});
</script>
</body>
</html>
