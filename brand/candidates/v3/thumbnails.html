<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DropSuite V3 Thumbnails</title>
<style>
  body { margin: 0; padding: 24px; background: #131417; color: #a8abb2; font: 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .cell { background: #18191c; border: 1px solid #2a2c31; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  h3 { margin: 0; font-size: 12px; color: #e6e7ea; font-weight: 600; }
  .t { font-size: 11px; color: #878a92; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
// Six first-pass concepts. Fill is applied by the wrapper; clip paths stay local to each symbol.
const T = [
  { name: 'A1 · Sliced Drop', terr: 'Controlled interception', body: (id) => `
    <defs>
      <path id="${id}d" d="M32 4L47.59 31A18 18 0 1 1 16.41 31Z"/>
      <clipPath id="${id}t"><rect x="0" y="0" width="64" height="38"/></clipPath>
      <clipPath id="${id}b"><rect x="0" y="44" width="64" height="20"/></clipPath>
    </defs>
    <use href="#${id}d" clip-path="url(#${id}t)"/>
    <g transform="translate(6 0)"><use href="#${id}d" clip-path="url(#${id}b)"/></g>` },
  { name: 'A2 · Re-routed Stream', terr: 'Controlled interception', body: () => `
    <path d="M14 18h20v14H14a7 7 0 0 1 0-14z"/>
    <path d="M40 32h10a7 7 0 0 1 0 14H40z"/>` },
  { name: 'B1 · Round-trip Fold', terr: 'Data transformation', body: () => `
    <path d="M6 10h36l14 14H6z"/>
    <path d="M58 28v26H20l12-12h12V28z"/>` },
  { name: 'B2 · Refraction', terr: 'Data transformation', body: () => `
    <path d="M4 14h22l-8 12H4z"/>
    <path d="M30 14h12L30 50H18z"/>
    <path d="M46 38h14v12H38z"/>` },
  { name: 'C1 · Corner Drop', terr: 'Abstract signature', body: () => `
    <path d="M56 8v26A22 22 0 1 1 34 12V8z" transform="rotate(0 32 32)"/>` },
  { name: 'C2 · Arch Slot', terr: 'Abstract signature', body: () => `
    <path d="M12 56V30a20 20 0 0 1 40 0v4H30v8h22v14z"/>` },
];
const g = document.getElementById('g');
T.forEach((t, i) => {
  const sv = (n, fill) => `<svg width="${n}" height="${n}" viewBox="0 0 64 64" fill="${fill}">${t.body('s' + i + n + fill.slice(1))}</svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="cell"><h3>${t.name}</h3><span class="t">${t.terr}</span>${sv(150, '#ececee')}<div class="row">${sv(32, '#ececee')}${sv(20, '#ececee')}${sv(16, '#ececee')}</div></div>`);
});
</script>
</body>
</html>
