<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DropSuite V3 Thumbnails, pass 3</title>
<style>
  body { margin: 0; padding: 24px; background: #131417; color: #a8abb2; font: 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .cell { background: #18191c; border: 1px solid #2a2c31; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  h3 { margin: 0; font-size: 12px; color: #e6e7ea; font-weight: 600; }
  .t { font-size: 11px; color: #878a92; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
const T = [
  { name: 'A1d · Sliced Drop, bold', terr: 'Controlled interception', body: (id) => `
    <defs><path id="${id}d" d="M32 1C32 1 56 23 56 39A24 24 0 0 1 8 39C8 23 32 1 32 1Z"/>
      <clipPath id="${id}t"><path d="M0 0H64V27L0 41Z"/></clipPath>
      <clipPath id="${id}b"><path d="M0 49L64 35V64H0Z"/></clipPath></defs>
    <use href="#${id}d" clip-path="url(#${id}t)"/>
    <g transform="translate(5 0)"><use href="#${id}d" clip-path="url(#${id}b)"/></g>` },
  { name: 'B3 · Exploded Disc', terr: 'Data transformation', body: (id) => `
    <defs><circle id="${id}c" cx="32" cy="32" r="24"/>
      <clipPath id="${id}1"><rect width="64" height="22"/></clipPath>
      <clipPath id="${id}2"><rect y="27" width="64" height="10"/></clipPath>
      <clipPath id="${id}3"><rect y="42" width="64" height="22"/></clipPath></defs>
    <g transform="translate(-6 0)"><use href="#${id}c" clip-path="url(#${id}1)"/></g>
    <use href="#${id}c" clip-path="url(#${id}2)"/>
    <g transform="translate(6 0)"><use href="#${id}c" clip-path="url(#${id}3)"/></g>` },
  { name: 'B4 · Pivot', terr: 'Data transformation', body: () => `
    <path d="M2 18H22V30H2Z"/><circle cx="32" cy="24" r="7"/><path d="M36.5 40.5L45 32L58 45L49.5 53.5Z"/>` },
  { name: 'C3m · Drop-d', terr: 'Abstract signature', body: () => `
    <path d="M50 4V40A20 20 0 1 1 30 20C38 20 46 13 50 4Z"/>` },
  { name: 'C5 · Bytes to Curve', terr: 'Abstract signature', body: () => `
    <path d="M8 56V44H16V32H24V20H32A24 24 0 0 1 56 44V56Z"/>` },
  { name: 'C6 · Blade', terr: 'Abstract signature', body: () => `
    <path d="M10 56A46 46 0 0 1 56 10V24A32 32 0 0 0 24 56Z"/>` },
];
const g = document.getElementById('g');
T.forEach((t, i) => {
  const sv = (n, fill) => `<svg width="${n}" height="${n}" viewBox="0 0 64 64" fill="${fill}">${t.body('s' + i + '_' + n)}</svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="cell"><h3>${t.name}</h3><span class="t">${t.terr}</span>${sv(150, '#ececee')}<div class="row">${sv(32, '#ececee')}${sv(20, '#ececee')}${sv(16, '#ececee')}</div></div>`);
});
</script>
</body>
</html>
