<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>DropSuite V5 probe: slab language</title>
<style>
  body { margin: 0; padding: 20px; background: #131417; color: #a8abb2; font: 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { background: #18191c; border: 1px solid #2a2c31; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cell.ref { border-color: #5c5f66; border-style: dashed; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  h3 { margin: 0; font-size: 12px; color: #e6e7ea; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
// Slimmer, taller drops (Lighter-like proportions) carrying the V4 hinge cut.
let uid = 0;
function drop(r, cy, ay) {
  const cx = 32, phi = Math.acos(r / (cy - ay));
  const tx = r * Math.sin(phi), ty = cy - r * Math.cos(phi);
  return `M32 ${ay}L${(cx + tx).toFixed(2)} ${ty.toFixed(2)}A${r} ${r} 0 1 1 ${(cx - tx).toFixed(2)} ${ty.toFixed(2)}Z`;
}
function hinge(d, yL, slope, gap, pivot, ang) {
  const a = 'h' + uid++, b = 'h' + uid++, y1 = yL + slope * 64;
  return `<clipPath id="${a}"><path d="M0 0H64V${y1 - gap / 2}L0 ${yL - gap / 2}Z"/></clipPath>
    <clipPath id="${b}"><path d="M0 ${yL + gap / 2}L64 ${y1 + gap / 2}V64H0Z"/></clipPath>
    <g transform="rotate(${ang} ${pivot})"><path d="${d}" clip-path="url(#${a})"/></g><path d="${d}" clip-path="url(#${b})"/>`;
}
const V = {
  'Referensi: Lighter (bukan milik kita)': { ref: true, body: '<g transform="translate(13 3) scale(2.2)"><path d="M5.989 20.388 0 25.498V5.888L5.989.502zm7.811.012-5.989 5.098V17.85l5.989-5.37z"/></g>' },
  'A2 sekarang (V4)': { body: hinge(drop(22, 40, 4), 41, -9 / 64, 2, '11 40', -12) },
  'R1 · A2 ramping': { body: hinge(drop(17, 44, 2), 46, -8 / 64, 2.2, '16 45', -13) },
  'R2 · A2 ramping, sudut tajam': { body: hinge(drop(16, 45, 1), 47, -10 / 64, 2.4, '17 46', -15) },
};
const g = document.getElementById('g');
for (const [name, v] of Object.entries(V)) {
  const sv = (n) => `<svg width="${n}" height="${n}" viewBox="0 0 64 64" fill="#ececee">${v.body}</svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="cell${v.ref ? ' ref' : ''}"><h3>${name}</h3>${sv(140)}<div class="row">${sv(32)}${sv(20)}${sv(16)}</div></div>`);
}
</script>
</body>
</html>
