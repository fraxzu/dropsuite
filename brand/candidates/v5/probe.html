<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>DropSuite V5 probe: slab language</title>
<style>
  body { margin: 0; padding: 20px; background: #131417; color: #a8abb2; font: 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { background: #18191c; border: 1px solid #2a2c31; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cell.ref { border-color: #5c5f66; border-style: dashed; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  h3 { margin: 0; font-size: 12px; color: #e6e7ea; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
// Slab grammar for DropSuite: solid slabs whose ends are sheared FALLING to the right
// (Lighter's rise), at ~30° (Lighter uses ~42°). k = drop over the slab width.
const slab = (x, w, yTop, yBot, k) => `M${x} ${yTop}L${x + w} ${yTop + k}V${yBot + k}L${x} ${yBot}Z`;
const k = 9; // 9 over 16 ≈ 29°
const V = {
  'Referensi: Lighter (bukan milik kita)': { ref: true, body: '<g transform="translate(13 3) scale(2.2)"><path d="M5.989 20.388 0 25.498V5.888L5.989.502zm7.811.012-5.989 5.098V17.85l5.989-5.37z"/></g>' },
  'S1 · Dropped Slab': { body: slab(24, 16, 2, 30, k) + slab(24, 16, 38, 50, k) },
  'S2 · Drawer (segmen ditarik keluar)': { body: slab(20, 16, 2, 20, k) + slab(28, 16, 26, 34, k) + slab(20, 16, 40, 52, k) },
  'S3 · Hinge Slab': { body: `<g transform="rotate(-14 24 34)">${slab(24, 16, 3, 28, k)}</g>` + slab(24, 16, 34, 52, k) },
  'S4 · Slab D (3 lempengan)': { body: slab(10, 14, 4, 51, 0) + `<path d="M28 4H38L54 24V31H44L28 13Z"/><path d="M28 60H38L54 40V33H44L28 51Z"/>` },
  'S5 · Slab D (2 lempengan)': { body: `<path d="M8 6H22V58H8Z"/><path d="M28 6H40L56 22V42L40 58H28V46H36L44 38V26L36 18H28Z"/>` },
  'S6 · Drop Slab': { body: `<path d="M22 22L38 2V44L22 58Z"/><path d="M42 46L52 34V50L42 62Z"/>` },
  'S7 · Split Column': { body: slab(14, 16, 6, 46, k) + slab(34, 16, 6, 46, k).replace('M34 6', 'M34 6') },
};
const g = document.getElementById('g');
for (const [name, v] of Object.entries(V)) {
  const sv = (n) => `<svg width="${n}" height="${n}" viewBox="0 0 64 64" fill="#ececee">${v.body.startsWith('<') ? v.body : `<path d="${v.body}"/>`}</svg>`;
  g.insertAdjacentHTML('beforeend', `<div class="cell${v.ref ? ' ref' : ''}"><h3>${name}</h3>${sv(140)}<div class="row">${sv(32)}${sv(20)}${sv(16)}</div></div>`);
}
</script>
</body>
</html>
