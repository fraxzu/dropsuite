<!doctype html><html><head><meta charset="utf-8"><title>DropSuite Brand Assets</title>
<style>
body{margin:0;padding:24px;background:#131417;color:#a8abb2;font:12px 'Segoe UI Variable Text','Segoe UI',sans-serif}
h2{color:#e6e7ea;font-size:13px;font-weight:600;margin:18px 0 8px}
.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.tab{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px 8px 0 0;width:180px}
img.px{image-rendering:pixelated}
</style></head><body>
<h2>Lockups</h2>
<div class="row"><img src="dropsuite-lockup-dark.svg" width="420"><img src="dropsuite-lockup-light.svg" width="420"></div>
<h2>App icon (icon-N.png from the build), on dark and light taskbars</h2>
<div class="row" id="icons"></div>
<div class="bar" style="background:#1f1f1f"><img src="app-icon/icon-24.png" width="24"><img src="app-icon/icon-32.png" width="24"><span style="color:#ccc">24 px taskbar, dark</span></div>
<div class="bar" style="background:#eeeeee"><img src="app-icon/icon-24.png" width="24"><span style="color:#333">24 px taskbar, light</span></div>
<h2>icon.ico (Windows reads the 16, 32 and 48 px entries directly)</h2>
<div class="row"><img src="app-icon/icon.ico" width="16"><img src="app-icon/icon.ico" width="32"><img src="app-icon/icon.ico" width="48"></div>
<h2>Favicon (frontend/public/favicon.svg) in light and dark tabs, and the 16 px raster ×6</h2>
<div class="row">
 <div class="bar" style="background:#dee1e6"><div class="tab" style="background:#fff;color:#202124"><img src="../../frontend/public/favicon.svg" width="16">DropSuite</div></div>
 <div class="bar" style="background:#202124;color-scheme:dark"><div class="tab" style="background:#35363a;color:#e8eaed"><img src="dropsuite-mark-white.svg" width="16">DropSuite</div></div>
 <img class="px" src="app-icon/icon-16.png" width="96"><img class="px" src="app-icon/icon-20.png" width="120">
</div>
<script>
for (const n of [16,20,24,32,40,48,64,128,256]) document.getElementById('icons').insertAdjacentHTML('beforeend', `<div class="tile"><img src="app-icon/icon-${n}.png" width="${n}"><span>${n}</span></div>`);
</script></body></html>
