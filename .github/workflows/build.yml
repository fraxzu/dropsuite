name: Build

# Cross-platform build verification. The desktop app is developed on Windows, so this workflow
# proves the Linux and macOS builds compile and bundle on real runners, and produces installable
# artifacts (.deb, .rpm, AppImage, .dmg) to download from each run.

on:
  push:
    branches: [main, linux-support]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (deb, rpm, AppImage)
            bundles: deb,rpm,appimage
          - os: macos-latest
            name: macOS (app, dmg)
            bundles: app,dmg
          - os: windows-latest
            name: Windows (nsis)
            bundles: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build app and bundles
        working-directory: frontend
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropsuite-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*-setup.exe
          if-no-files-found: warn
