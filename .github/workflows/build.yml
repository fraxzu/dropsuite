name: Build

# Cross-platform build verification. The desktop app is developed on Windows, so this workflow
# proves the Linux and macOS builds compile and bundle on real runners, and produces installable
# artifacts (.deb, .rpm, AppImage, .dmg) to download from each run.

on:
  push:
    branches: [main, linux-support]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (deb, rpm, AppImage)
            bundles: deb,rpm,appimage
          - os: macos-latest
            name: macOS (app, dmg)
            bundles: app,dmg
          - os: windows-latest
            name: Windows (nsis)
            bundles: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # Run from the repo root so the CLI finds crates/dropsuite-app/tauri.conf.json; the config
      # is in a crate folder, not the default src-tauri next to the frontend.
      - name: Build app and bundles
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropsuite-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*-setup.exe
          if-no-files-found: warn

  # The source repo is private, so downloads and the update check would 404 for everyone else.
  # On a v* tag, mirror the installers and the version manifest into the public feed repo.
  publish:
    name: Publish to public feed
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          find . -type f -exec sha256sum {} + | sed 's|  \./|  |' | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create the public release
        env:
          GH_TOKEN: ${{ secrets.FEED_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          REPO=fraxzu/dropsuite-updates
          V="${TAG#v}"
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --title "DropSuite $V" --notes "DropSuite $V"
          fi
          gh release upload "$TAG" -R "$REPO" dist/* --clobber

      - name: Update latest.json
        env:
          GH_TOKEN: ${{ secrets.FEED_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          REPO=fraxzu/dropsuite-updates
          V="${TAG#v}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" feed
          cd feed
          URL=$(gh release view "$TAG" -R "$REPO" --json url -q .url)
          python3 - "$V" "$URL" <<'PY'
          import json, sys
          version, url = sys.argv[1], sys.argv[2]
          with open("latest.json", "w") as f:
              json.dump({"version": version, "notes": f"DropSuite {version}", "url": url}, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update manifest to ${V}"
          git push
