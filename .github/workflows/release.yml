name: Release

# Build every platform on CI and upload the installers straight to a GitHub release from the
# runner, so large bundles never travel over a local connection. Run it by hand and point it at
# an existing release tag; each platform job appends its own files, then a final job publishes a
# SHA256SUMS over everything attached.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload the installers to
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: 'Linux (deb, rpm, AppImage)', bundles: 'deb,rpm,appimage' }
          - { os: macos-latest, name: 'macOS (dmg)', bundles: 'app,dmg' }
          - { os: windows-latest, name: 'Windows (nsis)', bundles: 'nsis' }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build app and bundles
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}

      - name: Upload installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: false

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Build SHA256SUMS over the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*' --skip-existing
          rm -f SHA256SUMS
          sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ inputs.tag }}" SHA256SUMS -R "${{ github.repository }}" --clobber
