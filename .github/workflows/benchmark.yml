name: Nightly Benchmark

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

jobs:
  portswigger-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run PortSwigger Benchmarks
        env:
          PORTSWIGGER_USER: ${{ secrets.PORTSWIGGER_USER }}
          PORTSWIGGER_PASS: ${{ secrets.PORTSWIGGER_PASS }}
        run: |
          cargo test -p dropsuite-core --test benchmark_portswigger -- --ignored --nocapture | tee benchmark_output.txt

      - name: Archive Benchmark Results
        run: |
          mkdir -p benchmarks/results
          TODAY=$(date +%Y-%m-%d)
          cp benchmark_output.txt "benchmarks/results/${TODAY}.md"

      - name: Commit Benchmark Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update benchmark results for $(date +%Y-%m-%d)"
          file_pattern: "benchmarks/results/*.md"
